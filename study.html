<script>
/* =====================================================================
   UNIT 6 STUDY HUB: Exponential Functions
   Study by topic (review + new practice) and the interactive study guide.
   Progress is saved in the student's own browser.
   ===================================================================== */
const DESMOS_GRAPH = 'https://www.desmos.com/testing/northcarolina/graphing';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const parseNum = s => {
  s = String(s == null ? '' : s).trim().replace(/[$,\s%]/g, '');
  if (!s) return null;
  const m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) return +m[2] === 0 ? null : +m[1] / +m[2];
  const v = Number(s); return isFinite(v) ? v : null;
};
const near = (v, t, tol) => v != null && Math.abs(v - t) <= (tol != null ? tol : 1e-6);
const fmt = (v, d = 2) => v.toLocaleString('en-US', { maximumFractionDigits: d });

/* ---------- small math helpers for writing content ---------- */
const X = '<i>x</i>', Y = '<i>y</i>';
const pw = (base, e) => `${base}<sup>${e}</sup>`;
const frac = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const box = name => `{{${name}}}`;

/* ---------- graph helpers ---------- */
function miniPlot(o) {
  const W = o.w || 320, Hh = o.h || 220, L = 40, R = 12, T = 12, B = 30;
  const Xp = x => L + (x - o.xmin) / (o.xmax - o.xmin) * (W - L - R), Yp = y => Hh - B - (y - o.ymin) / (o.ymax - o.ymin) * (Hh - T - B);
  let s = '';
  for (let y = o.ymin; y <= o.ymax + 1e-9; y += o.ystep) s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${Yp(y)}" y2="${Yp(y)}"/><text class="axt" x="${L - 5}" y="${Yp(y) + 4}" text-anchor="end">${fmt(y)}</text>`;
  for (let x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep || 1) s += `<line class="ax" x1="${Xp(x)}" x2="${Xp(x)}" y1="${T}" y2="${Hh - B}"/><text class="axt" x="${Xp(x)}" y="${Hh - B + 15}" text-anchor="middle">${x}</text>`;
  s += `<line class="ax0" x1="${L}" x2="${W - R}" y1="${Yp(Math.max(0, o.ymin))}" y2="${Yp(Math.max(0, o.ymin))}"/><line class="ax0" x1="${Xp(Math.max(0, o.xmin))}" x2="${Xp(Math.max(0, o.xmin))}" y1="${T}" y2="${Hh - B}"/>`;
  if (o.f) { const p = []; for (let i = 0; i <= 200; i++) { const x = o.xmin + (o.xmax - o.xmin) * i / 200, y = o.f(x); if (y <= o.ymax * 1.05 && y >= o.ymin - 1) p.push(`${Xp(x).toFixed(1)},${Yp(y).toFixed(1)}`); } s += `<polyline class="cv" points="${p.join(' ')}"/>`; }
  (o.pts || []).forEach(([x, y, lab]) => { s += `<circle class="pt" cx="${Xp(x)}" cy="${Yp(y)}" r="4.5"/>${lab ? `<text class="ptl" x="${Xp(x) + 7}" y="${Yp(y) - 7}">${esc(lab)}</text>` : ''}`; });
  if (o.label) s += `<text class="ptl" x="${W - R - 4}" y="${T + 12}" text-anchor="end">${esc(o.label)}</text>`;
  return `<svg class="mini" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.aria || 'Graph')}">${s}</svg>`;
}
function shape(kind) {
  const p = { eg: 'M10,78 C45,76 70,66 90,10', ed: 'M10,10 C30,66 55,76 90,78', li: 'M10,78 L90,14', ld: 'M10,14 L90,78' }[kind];
  return `<svg viewBox="0 0 100 90" class="shape" aria-hidden="true"><line x1="10" y1="82" x2="94" y2="82" class="ax0"/><line x1="10" y1="4" x2="10" y2="82" class="ax0"/><path d="${p}" class="cv"/></svg>`;
}
const SHAPES = [['eg', shape('eg') + 'Exponential growth'], ['ed', shape('ed') + 'Exponential decay'], ['li', shape('li') + 'Linear, increasing'], ['ld', shape('ld') + 'Linear, decreasing']];
const DOM = [['xge0', `${X} ≥ 0`], ['all', 'All real numbers'], ['xgt0b', `0 ≤ ${X} ≤ 1`], ['neg', `${X} ≤ 0`]];

/* =====================================================================
   CONTENT: six topics
   Part types: num, choice, pick (graph shapes), boxes (template), text (self-check)
   ===================================================================== */
const TOPICS = [
  {
    id: 't1', title: 'Properties of Exponents', guide: [1],
    review: `<p>Exponent rules let you rewrite expressions without expanding them. Final answers use <b>only positive exponents</b>.</p>
      <table class="rules"><tr><th>Rule</th><th>Example</th></tr>
        <tr><td>Product: add exponents</td><td>${pw(X, 3)} · ${pw(X, 4)} = ${pw(X, 7)}</td></tr>
        <tr><td>Quotient: subtract exponents</td><td>${frac(pw(X, 9), pw(X, 2))} = ${pw(X, 7)}</td></tr>
        <tr><td>Power of a power: multiply exponents</td><td>(${pw(X, 2)})<sup>5</sup> = ${pw(X, 10)}</td></tr>
        <tr><td>Power of a product: every factor gets the power</td><td>(3${pw(X, 2)}${Y})<sup>2</sup> = 9${pw(X, 4)}${pw(Y, 2)}</td></tr>
        <tr><td>Zero exponent</td><td>${pw(X, 0)} = 1</td></tr>
        <tr><td>Negative exponent: move it across the fraction bar</td><td>${pw(X, '−3')} = ${frac(1, pw(X, 3))}</td></tr></table>`,
    example: { q: `Rewrite ${frac(`(2${pw(X, 3)}${Y})<sup>2</sup>`, `4${pw(X, '−1')}${pw(Y, 5)}`)} with only positive exponents.`,
      steps: [`Apply the power to every factor on top: (2${pw(X, 3)}${Y})<sup>2</sup> = 4${pw(X, 6)}${pw(Y, 2)}.`, `Divide the coefficients: 4 ÷ 4 = 1.`, `Subtract the exponents of ${X}: 6 − (−1) = 7. Subtract the exponents of ${Y}: 2 − 5 = −3.`, `Move ${pw(Y, '−3')} to the bottom so the exponent is positive: <b>${frac(pw(X, 7), pw(Y, 3))}</b>.`] },
    practice: [
      { id: 'p1a', stem: `Rewrite ${pw('<i>a</i>', 4)} · ${pw('<i>a</i>', 9)}.`, parts: [{ k: 'x', type: 'boxes', tpl: `<i>a</i><sup>${box('e')}</sup>`, ans: { e: 13 }, hints: { e: [[v => v === 36, 'For a product with the same base, add the exponents.']] } }] },
      { id: 'p1b', stem: `Rewrite (3${pw('<i>m</i>', 2)}${pw('<i>n</i>', 5)})<sup>2</sup>.`, parts: [{ k: 'x', type: 'boxes', tpl: `${box('c')}<i>m</i><sup>${box('m')}</sup><i>n</i><sup>${box('n')}</sup>`, ans: { c: 9, m: 4, n: 10 },
        hints: { c: [[v => v === 6, 'The coefficient is squared too: 3 · 3.'], [v => v === 3, 'Every factor inside the parentheses gets the power, including the 3.']], n: [[v => v === 7, 'Power of a power: multiply the exponents, don’t add.']] } }] },
      { id: 'p1c', stem: `Rewrite ${frac(`12${pw('<i>a</i>', 7)}${pw('<i>b</i>', 3)}`, `4${pw('<i>a</i>', 2)}${pw('<i>b</i>', 6)}`)} with only positive exponents.`, parts: [{ k: 'x', type: 'boxes',
        tpl: frac(`${box('c')}<i>a</i><sup>${box('a')}</sup>`, `<i>b</i><sup>${box('b')}</sup>`), ans: { c: 3, a: 5, b: 3 }, hints: { c: [[v => v === 8, 'Divide the coefficients: 12 ÷ 4.']], b: [[v => v === -3, 'The exponent should be positive once the b is in the denominator.']] } }] },

      { k: 'dom', type: 'choice', label: 'g) Best domain', opts: DOM, ans: 'xge0' },
      { k: 'rng', type: 'choice', label: 'Best range', opts: [['r1', '0 < <i>p</i>(<i>x</i>) ≤ 34,000'], ['r2', 'All real numbers'], ['r3', '<i>p</i>(<i>x</i>) ≥ 34,000'], ['r4', '0 ≤ <i>p</i>(<i>x</i>) ≤ 0.89']], ans: 'r1' }] },
  { id: 'g6', n: 6, topic: 't5', stem: `The milligrams of ibuprofen in a person’s body is <i>f</i>(<i>t</i>) = 200 · ${frac(3, 4)}<sup><i>t</i></sup>, where <i>t</i> is the number of hours since the patient took the medicine.`,
    parts: [{ k: 'a', type: 'num', label: 'a) How much ibuprofen did the person take to begin with?', unit: 'mg', ans: 200 },
      { k: 'b3', type: 'num', label: 'b) How much will be left after 3 hours?', unit: 'mg', ans: 84.375, tol: 0.01, hints: [[v => near(v, 450, 1), 'Multiply by 3/4 three times. The amount should go down.']] },
      { k: 'p30', type: 'num', label: 'c) How much will have been processed after 30 minutes? Round to the nearest hundredth.', unit: 'mg', ans: 26.79, tol: 0.02, hints: [[v => near(v, 173.21, 0.05), 'That’s how much is left. Subtract from 200.']] },
      { k: 'b', type: 'num', label: 'd) What is the decay factor?', ans: 0.75 },
      { k: 'mean', type: 'choice', label: 'What does it tell us?', opts: [['m1', 'Each hour, 3/4 (75%) of the ibuprofen remains.'], ['m2', 'Each hour, 75 mg leaves the body.'], ['m3', 'Each hour, 3/4 of the ibuprofen leaves the body.'], ['m4', 'The medicine lasts 3/4 of an hour.']], ans: 'm1' },
      { k: 'dc', type: 'choice', label: 'f) Should the graph be discrete or continuous?', opts: [['c', 'Continuous'], ['d', 'Discrete']], ans: 'c' },
      { k: 'why', type: 'text', label: 'Explain why.', sample: 'Time keeps passing between whole hours, and there is always some ibuprofen in the body at every moment, so the graph should be a connected curve.' },
      { k: 'dom', type: 'choice', label: 'g) Best domain', opts: [['xge0', '<i>t</i> ≥ 0'], ['all', 'All real numbers'], ['b', '0 ≤ <i>t</i> ≤ 200'], ['neg', '<i>t</i> ≤ 0']], ans: 'xge0' },
      { k: 'rng', type: 'choice', label: 'Best range', opts: [['r1', '0 < <i>f</i>(<i>t</i>) ≤ 200'], ['r2', 'All real numbers'], ['r3', '<i>f</i>(<i>t</i>) ≥ 200'], ['r4', '0 ≤ <i>f</i>(<i>t</i>) ≤ 0.75']], ans: 'r1' }] },
  { id: 'g7', n: 7, topic: 't6', stem: 'Tanvi deposited $600 when she was 10 and will take out all the money on her 21st birthday. Option 1 grows by $50 each year. Option 2 grows by 9% each year.',
    parts: [{ k: 'o1', type: 'num', label: 'Option 1 at age 21', unit: '$', ans: 1150, hints: [[v => v === 1100, 'From age 10 to 21 is 11 years.']] },
      { k: 'o2', type: 'num', label: 'Option 2 at age 21 (nearest cent)', unit: '$', ans: 1548.26, tol: 0.02, hints: [[v => near(v, 1420.41, 0.05), 'From age 10 to 21 is 11 years, not 10.']] },
      { k: 'w', type: 'choice', label: 'Which account will be worth more when she is 21?', opts: [['1', 'Option 1'], ['2', 'Option 2']], ans: '2' }] },
  { id: 'g8', n: 8, topic: 't6', stem: 'Mrs. S had 2 rabbits in her backyard. One month later, the number of rabbits had doubled. Ms. Jones has mice in her garage:', visual: tableHTML(['<i>n</i>, months', 0, 1, 2, 3, 4], ['<i>m</i>, mice', 10, 14, 18, 22, 26]),
    parts: [{ k: 'r', type: 'boxes', label: 'a) Write an equation for the rabbits after <i>n</i> months.', tpl: `<i>r</i>(<i>n</i>) = ${box('a')} · (${box('b')})<sup><i>n</i></sup>`, ans: { a: 2, b: 2 } },
      { k: 'r8', type: 'num', label: 'b) Find <i>r</i>(8).', ans: 512, hints: [[v => v === 32, 'That is 2 · 2 · 8. Double 8 times instead.']] },
      { k: 'r8m', type: 'choice', label: 'What does <i>r</i>(8) = 512 mean?', opts: [['m1', 'After 8 months, Mrs. S has 512 rabbits.'], ['m2', 'It takes 512 months to have 8 rabbits.'], ['m3', 'Mrs. S gains 512 rabbits each month.']], ans: 'm1' },
      { k: 'over80', type: 'num', label: 'c) After how many months will Mrs. S first have more than 80 rabbits?', ans: 6, hints: [[v => v === 5, 'After 5 months she has 64 rabbits.']] },
      { k: 'm', type: 'boxes', label: 'd) Write an equation for the mice.', tpl: `<i>m</i>(<i>n</i>) = ${box('b')} + ${box('k')}<i>n</i>`, ans: { b: 10, k: 4 } },
      { k: 'same', type: 'choice', label: 'e) When are the two populations the same?', opts: [['a', 'Between 2 and 3 months'], ['b', 'Between 3 and 4 months'], ['c', 'At exactly 5 months'], ['d', 'Never']], ans: 'b' },
      { k: 'why', type: 'text', label: 'f) Explain why the rabbits will eventually outnumber the mice even though the mice started with more.', sample: 'The mice increase by 4 each month (linear), but the rabbits double each month (exponential). Doubling adds more and more each month, so the rabbits catch up and pass the mice between months 3 and 4.' }] }
];

function tableHTML(r1, r2, vertical) {
  if (vertical) return `<table class="vt"><tr><th>${r1[0]}</th><th>${r2[0]}</th></tr>${r1.slice(1).map((v, i) => `<tr><td>${v}</td><td>${fmt(r2[i + 1], 4)}</td></tr>`).join('')}</table>`;
  return `<div class="tscroll"><table class="ht"><tr><th>${r1[0]}</th>${r1.slice(1).map(v => `<td>${v}</td>`).join('')}</tr><tr><th>${r2[0]}</th>${r2.slice(1).map(v => `<td>${fmt(v, 4)}</td>`).join('')}</tr></table></div>`;
}

/* =====================================================================
   PROGRESS (saved in this browser)
   ===================================================================== */
const KEY = 'u6studyhub';
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const partDone = (pid, k) => P[pid] && P[pid][k] && P[pid][k].ok;
const probDone = pr => pr.parts.every(pt => partDone(pr.id, pt.k));
const countDone = list => list.filter(probDone).length;

/* =====================================================================
   RENDERING PROBLEMS
   ===================================================================== */
function inputFor(pr, pt) {
  const st = (P[pr.id] && P[pr.id][pt.k]) || {}, id = `${pr.id}__${pt.k}`, cls = st.ok ? 'ok' : st.tries ? 'no' : '';
  if (pt.type === 'num') return `<span class="numwrap">${pt.unit === '$' ? '<span class="unit">$</span>' : ''}<input class="in ${cls}" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(st.v || '')}" aria-label="Answer">${pt.unit && pt.unit !== '$' ? `<span class="unit">${esc(pt.unit)}</span>` : ''}</span>`;
  if (pt.type === 'boxes') return `<div class="tpl ${cls}">${pt.tpl.replace(/\{\{(\w+)\}\}/g, (_, n) => `<input class="bx ${st.boxes && st.boxes[n] != null ? (st.boxOk && st.boxOk[n] ? 'ok' : 'no') : ''}" id="${id}__${n}" inputmode="decimal" autocomplete="off" value="${esc(st.boxes ? st.boxes[n] || '' : '')}" aria-label="${n}">`)}</div>`;
  if (pt.type === 'choice' || pt.type === 'pick') return `<div class="opts ${pt.type === 'pick' ? 'picks' : ''}" role="radiogroup">${pt.opts.map(([v, t]) => `<button type="button" class="opt ${st.v === v ? 'sel' : ''} ${st.v === v ? cls : ''}" data-act="opt" data-id="${id}" data-v="${v}" role="radio" aria-checked="${st.v === v}">${t}</button>`).join('')}</div>`;
  if (pt.type === 'text') return `<textarea class="in ta" id="${id}" rows="3" placeholder="Write your answer, then compare with a sample.">${esc(st.v || '')}</textarea>`;
  return '';
}
function ansText(pt) {
  if (pt.type === 'num') { const v = pt.ans; return (pt.unit === '$' ? '$' : '') + fmt(v, 4) + (pt.unit && pt.unit !== '$' ? ' ' + pt.unit : ''); }
  if (pt.type === 'boxes') return pt.tpl.replace(/\{\{(\w+)\}\}/g, (_, n) => { const v = pt.ans[n]; return `<b>${Math.abs(v - Math.round(v)) > 1e-9 ? (near(v, 1 / 3) ? '1/3' : fmt(v, 4)) : v}</b>`; });
  if (pt.type === 'choice' || pt.type === 'pick') return pt.opts.find(o => o[0] === pt.ans)[1];
  if (pt.type === 'text') return pt.sample;
}
function problemHTML(pr, num) {
  const done = probDone(pr);
  return `<article class="prob ${done ? 'done' : ''}" id="pr-${pr.id}">
    <div class="phead"><span class="pnum">${num}</span>${done ? '<span class="badge ok">Complete</span>' : ''}</div>
    <div class="stem">${pr.stem}</div>${pr.visual ? `<div class="visual">${pr.visual}</div>` : ''}
    ${pr.parts.map(pt => { const st = (P[pr.id] && P[pr.id][pt.k]) || {};
      return `<div class="part" id="pt-${pr.id}-${pt.k}">${pt.label ? `<div class="plabel">${pt.label}</div>` : ''}${inputFor(pr, pt)}
        <div class="fb" id="fb-${pr.id}-${pt.k}">${feedbackHTML(pr, pt, st)}</div></div>`; }).join('')}
    <div class="row pfoot"><button class="btn" data-act="check" data-p="${pr.id}">Check</button><button class="ghost" data-act="clearp" data-p="${pr.id}">Clear answers</button></div>
  </article>`;
}
function feedbackHTML(pr, pt, st) {
  if (pt.type === 'text') return st.shown ? `<div class="sample"><b>Sample answer:</b> ${esc(pt.sample)}</div>` : st.v ? `<button class="ghost small" data-act="sample" data-p="${pr.id}" data-k="${pt.k}">Compare with a sample answer</button>` : '';
  if (!st.tries) return '';
  if (st.ok) return '<span class="mk ok">Correct</span>';
  let h = `<span class="mk no">${esc(st.hint || 'Not quite. Try again.')}</span>`;
  if (st.tries >= 2) h += st.reveal ? `<div class="sample"><b>Answer:</b> ${ansText(pt)}</div>` : ` <button class="ghost small" data-act="reveal" data-p="${pr.id}" data-k="${pt.k}">Show answer</button>`;
  return h;
}
const findProb = id => { for (const t of TOPICS) { const p = t.practice.find(x => x.id === id); if (p) return p; } return GUIDE.find(x => x.id === id); };
function checkProblem(pid) {
  const pr = findProb(pid); P[pid] = P[pid] || {};
  pr.parts.forEach(pt => {
    const id = `${pid}__${pt.k}`, st = P[pid][pt.k] = P[pid][pt.k] || {};
    if (pt.type === 'text') { const t = $('#' + id); st.v = t ? t.value.trim() : ''; st.ok = !!st.v && !!st.shown; return; }
    if (st.ok) return;
    let ok = false, hint = null, entered = false;
    if (pt.type === 'num') {
      const raw = ($('#' + id) || {}).value || ''; st.v = raw; if (!raw.trim()) return; entered = true;
      const v = parseNum(raw); ok = near(v, pt.ans, pt.tol != null ? pt.tol : Math.max(1e-6, Math.abs(pt.ans) * 1e-6));
      if (!ok && pt.hints) { const h = pt.hints.find(([f]) => v != null && f(v)); if (h) hint = h[1]; }
      if (!ok && v == null) hint = 'Enter a number (fractions like 3/4 are fine).';
    } else if (pt.type === 'boxes') {
      st.boxes = {}; st.boxOk = {}; ok = true;
      Object.keys(pt.ans).forEach(n => {
        const raw = ($(`#${id}__${n}`) || {}).value || ''; st.boxes[n] = raw; if (raw.trim()) entered = true;
        const v = parseNum(raw), good = near(v, pt.ans[n], 1e-4); st.boxOk[n] = good; if (!good) ok = false;
        if (!good && !hint && pt.hints && pt.hints[n]) { const h = pt.hints[n].find(([f]) => v != null && f(v)); if (h && h[1]) hint = h[1]; }
      });
      if (!entered) return;
      if (!ok && !hint) hint = `${Object.values(st.boxOk).filter(Boolean).length} of ${Object.keys(pt.ans).length} boxes are correct. Red boxes need another look.`;
    } else {
      if (!st.v) return; entered = true; ok = st.v === pt.ans;
    }
    st.tries = (st.tries || 0) + (ok ? 0 : 1); if (ok) st.tries = Math.max(1, st.tries); st.ok = ok; st.hint = hint;
  });
  save(); rerenderProblem(pid);
}
function rerenderProblem(pid) {
  const pr = findProb(pid), el = $('#pr-' + pid); if (!el) return;
  const num = el.querySelector('.pnum').textContent; el.outerHTML = problemHTML(pr, num); updateCounts();
}
function updateCounts() {
  const c = $('#count'); if (!c) return;
  if (c.dataset.k === 'guide') c.textContent = `${countDone(GUIDE)} of ${GUIDE.length} questions complete`;
  else { const t = TOPICS[+c.dataset.k]; c.textContent = `${countDone(t.practice)} of ${t.practice.length}`; }
}

/* =====================================================================
   PAGES
   ===================================================================== */
function page(inner, crumb) {
  $('#app').innerHTML = `<div class="wrap">
    <nav class="top"><a href="#" class="home">Unit 6 Study Hub</a>${crumb ? `<span class="crumb">${crumb}</span>` : ''}<button class="ghost calcbtn" data-act="calc">Desmos</button></nav>
    ${inner}</div>
    <aside id="calcpanel" class="calcpanel" hidden><div class="row" style="justify-content:space-between"><b>NC Desmos graphing calculator</b><span class="row"><a class="hint" href="${DESMOS_GRAPH}" target="_blank" rel="noopener">New tab</a><button class="ghost small" data-act="calc">Close</button></span></div><iframe title="NC Desmos graphing calculator" data-src="${DESMOS_GRAPH}"></iframe></aside>`;
  window.scrollTo(0, 0);
}
function homePage() {
  const gDone = countDone(GUIDE);
  page(`<header class="hero"><h1>Unit 6: Exponential Functions</h1><p>Review each topic, practice with new problems, then work through the study guide. Your progress saves on this device.</p></header>
    <h2 class="sec">Study by topic</h2>
    <div class="tgrid">${TOPICS.map((t, i) => { const d = countDone(t.practice), n = t.practice.length;
      return `<a class="tcard" href="#${t.id}"><span class="tnum">${i + 1}</span><div><h3>${t.title}</h3><p class="hint">Study guide question${t.guide.length > 1 ? 's' : ''} ${t.guide.join(' and ')}</p>
        <div class="meter"><span style="width:${100 * d / n}%"></span></div><p class="hint">${d} of ${n} practice problems complete</p></div></a>`; }).join('')}</div>
    <h2 class="sec">The study guide</h2>
    <a class="tcard guide" href="#guide"><span class="tnum">SG</span><div><h3>Unit 6 Study Guide, interactive</h3><p class="hint">All 8 questions from your paper copy. Work on paper, then check each part here.</p>
      <div class="meter"><span style="width:${100 * gDone / GUIDE.length}%"></span></div><p class="hint">${gDone} of ${GUIDE.length} questions complete</p></div></a>
    <p style="margin-top:28px"><button class="ghost danger" data-act="resetall">Reset all my progress</button></p>`);
}
function topicPage(t, tab) {
  const i = TOPICS.indexOf(t), d = countDone(t.practice);
  page(`<header class="thead"><span class="tnum big">${i + 1}</span><div><h1>${t.title}</h1><p class="hint">Matches study guide question${t.guide.length > 1 ? 's' : ''} ${t.guide.join(' and ')}.</p></div></header>
    <div class="tabs"><a class="${tab === 'review' ? 'cur' : ''}" href="#${t.id}">Review</a><a class="${tab === 'practice' ? 'cur' : ''}" href="#${t.id}/practice">Practice <span id="count" data-k="${i}">${d} of ${t.practice.length}</span></a></div>
    ${tab === 'review' ? `<section class="card review">${t.review}</section>
      <section class="card example"><h3>Worked example</h3><div class="stem">${t.example.q}</div><ol class="wsteps" id="steps">${t.example.steps.map((s, j) => `<li ${j ? 'hidden' : ''}>${s}</li>`).join('')}</ol>
        <div class="row"><button class="ghost" data-act="nextstep">Show next step</button><a class="btn" href="#${t.id}/practice">Start practice</a></div></section>`
      : t.practice.map((p, j) => problemHTML(p, `Problem ${j + 1}`)).join('') + `<div class="row nav2">${i > 0 ? `<a class="ghost" href="#${TOPICS[i - 1].id}">← ${TOPICS[i - 1].title}</a>` : '<span></span>'}${i < TOPICS.length - 1 ? `<a class="btn alt" href="#${TOPICS[i + 1].id}">Next topic: ${TOPICS[i + 1].title}</a>` : `<a class="btn alt" href="#guide">Go to the study guide</a>`}</div>`}`,
    t.title);
}
function guidePage() {
  page(`<header class="thead"><span class="tnum big">SG</span><div><h1>Unit 6 Study Guide</h1><p class="hint">Work each question on your paper copy, then enter your answers to check them. Stuck? Each question links to its review topic.</p></div></header>
    <p class="hint" style="margin:0 0 10px"><span id="count" data-k="guide">${countDone(GUIDE)} of ${GUIDE.length} questions complete</span></p>
    ${GUIDE.map(g => { const t = TOPICS.find(x => x.id === g.topic); return problemHTML(g, `Question ${g.n}`).replace('<div class="row pfoot">', `<div class="row pfoot"><a class="hint reviewlink" href="#${t.id}">Review: ${t.title}</a>`); }).join('')}`, 'Study guide');
}
function route() {
  const h = location.hash.replace('#', '');
  if (h === 'guide') return guidePage();
  const [tid, tab] = h.split('/'), t = TOPICS.find(x => x.id === tid);
  if (t) return topicPage(t, tab === 'practice' ? 'practice' : 'review');
  homePage();
}
window.addEventListener('hashchange', route);

/* ---------- events ---------- */
const H = {
  check: b => checkProblem(b.dataset.p),
  clearp: b => { delete P[b.dataset.p]; save(); rerenderProblem(b.dataset.p); },
  opt: b => { const [pid, k] = b.dataset.id.split('__'); P[pid] = P[pid] || {}; const st = P[pid][k] = P[pid][k] || {}; if (st.ok) return; st.v = b.dataset.v;
    b.parentElement.querySelectorAll('.opt').forEach(o => { const on = o === b; o.classList.toggle('sel', on); o.classList.remove('ok', 'no'); o.setAttribute('aria-checked', on); }); },
  reveal: b => { P[b.dataset.p][b.dataset.k].reveal = true; save(); rerenderProblem(b.dataset.p); },
  sample: b => { const pid = b.dataset.p, k = b.dataset.k, t = $(`#${pid}__${k}`); P[pid] = P[pid] || {}; const st = P[pid][k] = P[pid][k] || {}; st.v = t ? t.value.trim() : st.v; st.shown = true; st.ok = !!st.v; save(); rerenderProblem(pid); },
  nextstep: b => { const h = [...document.querySelectorAll('#steps li[hidden]')]; if (h[0]) h[0].hidden = false; if (h.length <= 1) b.disabled = true; },
  calc: () => { const p = $('#calcpanel'); if (!p) return; p.hidden = !p.hidden; const f = p.querySelector('iframe'); if (!p.hidden && !f.src) f.src = f.dataset.src; },
  resetall: () => { if (confirm('Erase all of your progress on this device?')) { P = {}; save(); route(); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = H[b.dataset.act]; if (f) { e.preventDefault(); f(b); } });
document.addEventListener('input', e => {
  if (e.target.classList.contains('ta')) { const [pid, k] = e.target.id.split('__'); P[pid] = P[pid] || {}; const st = P[pid][k] = P[pid][k] || {}; const had = !!st.v; st.v = e.target.value.trim(); save();
    if (!had && st.v && !st.shown) { const fb = $(`#fb-${pid}-${k}`); if (fb) fb.innerHTML = `<button class="ghost small" data-act="sample" data-p="${pid}" data-k="${k}">Compare with a sample answer</button>`; } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input.in, input.bx')) { const pr = e.target.closest('.prob'); if (pr) checkProblem(pr.id.replace('pr-', '')); } });
route();
</script>
</body>
